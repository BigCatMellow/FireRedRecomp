name: Local Worker Bridge

on:
  push:
    branches: [main]
    paths:
      - 'work/local-runner/requests/**.patch'
      - 'work/local-runner/probes/**.probe'

permissions:
  contents: write

concurrency:
  group: firered-local-worker-bridge
  cancel-in-progress: false

jobs:
  local-worker:
    # Repository-level self-hosted runner. This workflow never runs for pull_request.
    runs-on: [self-hosted, linux, x64, firered-local]
    timeout-minutes: 30

    steps:
      - name: Check out trusted main push
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Identify bridge request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only HEAD^ HEAD -- 'work/local-runner/requests/*.patch' 'work/local-runner/probes/*.probe' || true)"
          count="$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)"
          if [ "$count" -ne 1 ]; then
            echo "Expected exactly one bridge request/probe in the triggering commit; found $count" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi
          file="$(printf '%s\n' "$changed" | sed '/^$/d')"
          case "$file" in
            work/local-runner/probes/*.probe) mode=probe ;;
            work/local-runner/requests/*.patch) mode=patch ;;
            *) echo "Unexpected bridge path: $file" >&2; exit 1 ;;
          esac
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Select explicit task route
        id: route
        shell: bash
        env:
          REQUEST_FILE: ${{ steps.request.outputs.file }}
        run: |
          set -euo pipefail
          base="$(basename "$REQUEST_FILE")"
          case "$base" in
            phase3-title-oak-entry-proof*.patch|phase3-title-oak-entry-proof*.probe)
              route='phase3-title-oak-entry-proof'
              ;;
            phase3-complete-runtime-exit-replay*.patch|phase3-complete-runtime-exit-replay*.probe)
              route='phase3-complete-runtime-exit-replay'
              ;;
            phase2-gba-camera-viewport-proof*.patch|phase2-gba-camera-viewport-proof*.probe)
              route='phase2-gba-camera-viewport-proof'
              ;;
            phase2-oak-reference-evidence-harness*.patch|phase2-oak-reference-evidence-harness*.probe)
              route='phase2-oak-reference-evidence-harness'
              ;;
            phase4-trainer-party-no-item-layouts*.patch|phase4-trainer-party-no-item-layouts*.probe)
              route='phase4-trainer-party-no-item-layouts'
              ;;
            phase4-foe-only-multimon-trainer-orchestration*.patch|phase4-foe-only-multimon-trainer-orchestration*.probe)
              route='phase4-foe-only-multimon-trainer-orchestration'
              ;;
            phase4-player-forced-replacement-ui*.patch|phase4-player-forced-replacement-ui*.probe)
              route='phase4-player-forced-replacement-ui'
              ;;
            phase4-player-voluntary-switch*.patch|phase4-player-voluntary-switch*.probe)
              route='phase4-player-voluntary-switch'
              ;;
            phase4-fixed-damage-effects*.patch|phase4-fixed-damage-effects*.probe)
              route='phase4-fixed-damage-effects'
              ;;
            phase4-always-hit-effects*.patch|phase4-always-hit-effects*.probe)
              route='phase4-always-hit-effects'
              ;;
            phase4-high-critical-effects*.patch|phase4-high-critical-effects*.probe)
              route='phase4-high-critical-effects'
              ;;
            phase4-false-swipe-effects*.patch|phase4-false-swipe-effects*.probe)
              route='phase4-false-swipe-effects'
              ;;
            phase4-vital-throw-effects*.patch|phase4-vital-throw-effects*.probe)
              route='phase4-vital-throw-effects'
              ;;
            phase4-two-sided-replacement-state-api*.patch|phase4-two-sided-replacement-state-api*.probe)
              route='phase4-two-sided-replacement-state-api'
              ;;
            phase4-explosion-effects*.patch|phase4-explosion-effects*.probe)
              route='phase4-explosion-effects'
              ;;
            phase4-super-fang-effects*.patch|phase4-super-fang-effects*.probe)
              route='phase4-super-fang-effects'
              ;;
            phase4-flail-effects*.patch|phase4-flail-effects*.probe)
              route='phase4-flail-effects'
              ;;
            phase4-eruption-effects*.patch|phase4-eruption-effects*.probe)
              route='phase4-eruption-effects'
              ;;
            phase4-psywave-effects*.patch|phase4-psywave-effects*.probe)
              route='phase4-psywave-effects'
              ;;
            phase4-ohko-effects*.patch|phase4-ohko-effects*.probe)
              route='phase4-ohko-effects'
              ;;
            phase4-endeavor-effects*.patch|phase4-endeavor-effects*.probe)
              route='phase4-endeavor-effects'
              ;;
            oak-parcel-dex-presentation-north*.patch|oak-parcel-dex-presentation-north*.probe)
              route='oak-parcel-dex-presentation-north'
              ;;
            runner-online*.probe)
              route='runner-readiness'
              ;;
            *)
              echo "Unknown Local Worker Bridge task route for request: $base" >&2
              exit 1
              ;;
          esac
          echo "route=$route" >> "$GITHUB_OUTPUT"
          echo "Selected explicit bridge route: $route"

      - name: Verify local toolchain
        shell: bash
        run: |
          set -euo pipefail
          command -v git >/dev/null
          if command -v lua5.1 >/dev/null; then
            lua5.1 -v
          elif command -v lua >/dev/null; then
            lua -v
          else
            echo "Lua is not installed on the self-hosted runner." >&2
            exit 1
          fi

      - name: Locate and verify private FireRed ROM
        id: rom
        shell: bash
        run: |
          set -euo pipefail
          expected='41cb23d8dccc8ebd7c649cd8fbb58eeace6e2fdc'
          rom="${POKEPORT_ROM:-}"
          if [ -z "$rom" ]; then
            rom="$(find "$HOME/Documents/Projects/Pokemon_ReComp_FireRed" -type f -name 'pokefirered.gba' -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$rom" ] || [ ! -f "$rom" ]; then
            echo "Verified ROM not found. Set POKEPORT_ROM for the runner or keep pokefirered.gba under the configured private project tree." >&2
            exit 1
          fi
          actual="$(sha1sum "$rom" | awk '{print $1}')"
          if [ "$actual" != "$expected" ]; then
            echo "ROM SHA-1 mismatch. Expected $expected, got $actual. Refusing ROM-backed execution." >&2
            exit 1
          fi
          echo "ROM SHA-1 verified for FireRed US v1.0."
          echo "path=$rom" >> "$GITHUB_OUTPUT"

      - name: Probe complete
        if: steps.request.outputs.mode == 'probe'
        shell: bash
        env:
          ROUTE: ${{ steps.route.outputs.route }}
        run: |
          set -euo pipefail
          echo "Explicit task route '$ROUTE' recognized."
          echo "Self-hosted runner, Lua toolchain, repository checkout, and private ROM hash gate are ready."

      - name: Validate bounded patch targets
        if: steps.request.outputs.mode == 'patch'
        shell: bash
        env:
          PATCH_FILE: ${{ steps.request.outputs.file }}
          ROUTE: ${{ steps.route.outputs.route }}
        run: |
          set -euo pipefail
          test -s "$PATCH_FILE"
          targets="$(grep -E '^(--- a/|\+\+\+ b/)' "$PATCH_FILE" | sed -E 's#^(--- a/|\+\+\+ b/)##' | grep -v '^/dev/null$' | sort -u)"
          test -n "$targets"
          while IFS= read -r target; do
            case "$ROUTE:$target" in
              oak-parcel-dex-presentation-north:main.lua|oak-parcel-dex-presentation-north:src/core/OakParcelDexPresentation.lua|oak-parcel-dex-presentation-north:tests/oak_parcel_dex_presentation_test.lua|oak-parcel-dex-presentation-north:scripts/runtime_natural_capture_replay.sh|oak-parcel-dex-presentation-north:work/tasks/oak-parcel-dex-presentation-north.md)
                ;;
              phase3-title-oak-entry-proof:main.lua|phase3-title-oak-entry-proof:tests/phase3_title_oak_entry_test.lua|phase3-title-oak-entry-proof:scripts/runtime_title_oak_entry_replay.sh|phase3-title-oak-entry-proof:work/tasks/phase3-title-oak-entry-proof.md|phase3-title-oak-entry-proof:work/tasks/phase3-exit-proof.md)
                ;;
              phase3-complete-runtime-exit-replay:main.lua|phase3-complete-runtime-exit-replay:tests/phase3_complete_runtime_exit_replay_test.lua|phase3-complete-runtime-exit-replay:scripts/runtime_phase3_complete_exit_replay.sh|phase3-complete-runtime-exit-replay:work/tasks/phase3-complete-runtime-exit-replay.md|phase3-complete-runtime-exit-replay:work/tasks/phase3-exit-proof.md)
                ;;
              phase2-gba-camera-viewport-proof:main.lua|phase2-gba-camera-viewport-proof:src/core/CameraViewport.lua|phase2-gba-camera-viewport-proof:tests/camera_viewport_test.lua|phase2-gba-camera-viewport-proof:tests/phase2_camera_viewport_integration_test.lua|phase2-gba-camera-viewport-proof:scripts/runtime_camera_viewport_replay.sh|phase2-gba-camera-viewport-proof:work/tasks/phase2-gba-camera-viewport-proof.md|phase2-gba-camera-viewport-proof:work/coordination/STATE.json|phase2-gba-camera-viewport-proof:work/coordination/HANDOFF.md|phase2-gba-camera-viewport-proof:work/reviews/phase2-gba-camera-viewport-proof-review.md)
                ;;
              phase2-oak-reference-evidence-harness:main.lua|phase2-oak-reference-evidence-harness:tests/phase2_oak_reference_evidence_test.lua|phase2-oak-reference-evidence-harness:scripts/phase2_oak_reference_evidence_capture.sh|phase2-oak-reference-evidence-harness:work/tasks/phase2-oak-reference-evidence-harness.md|phase2-oak-reference-evidence-harness:work/coordination/STATE.json|phase2-oak-reference-evidence-harness:work/coordination/HANDOFF.md)
                ;;
              phase4-trainer-party-no-item-layouts:src/core/TrainerPokemonFactory.lua|phase4-trainer-party-no-item-layouts:tests/trainer_pokemon_factory_test.lua|phase4-trainer-party-no-item-layouts:tests/phase4_trainer_party_rom_test.lua|phase4-trainer-party-no-item-layouts:work/tasks/phase4-trainer-party-no-item-layouts.md|phase4-trainer-party-no-item-layouts:work/coordination/STATE.json|phase4-trainer-party-no-item-layouts:work/coordination/HANDOFF.md)
                ;;
              phase4-foe-only-multimon-trainer-orchestration:main.lua|phase4-foe-only-multimon-trainer-orchestration:src/core/BattleSceneController.lua|phase4-foe-only-multimon-trainer-orchestration:src/core/TrainerBattleOrchestrator.lua|phase4-foe-only-multimon-trainer-orchestration:tests/phase4_foe_only_multimon_controller_test.lua|phase4-foe-only-multimon-trainer-orchestration:tests/phase4_foe_only_multimon_rom_test.lua|phase4-foe-only-multimon-trainer-orchestration:scripts/runtime_phase4_foe_only_multimon_replay.sh|phase4-foe-only-multimon-trainer-orchestration:work/tasks/phase4-foe-only-multimon-trainer-orchestration.md|phase4-foe-only-multimon-trainer-orchestration:work/coordination/STATE.json|phase4-foe-only-multimon-trainer-orchestration:work/coordination/HANDOFF.md)
                ;;
              phase4-player-forced-replacement-ui:main.lua|phase4-player-forced-replacement-ui:src/core/BattleSceneController.lua|phase4-player-forced-replacement-ui:tests/phase4_player_forced_replacement_controller_test.lua|phase4-player-forced-replacement-ui:tests/phase4_player_forced_replacement_rom_test.lua|phase4-player-forced-replacement-ui:scripts/runtime_phase4_player_forced_replacement_replay.sh|phase4-player-forced-replacement-ui:work/tasks/phase4-player-forced-replacement-ui.md|phase4-player-forced-replacement-ui:work/coordination/STATE.json|phase4-player-forced-replacement-ui:work/coordination/HANDOFF.md)
                ;;
              phase4-player-voluntary-switch:main.lua|phase4-player-voluntary-switch:src/core/BattleSceneController.lua|phase4-player-voluntary-switch:tests/phase4_player_voluntary_switch_controller_test.lua|phase4-player-voluntary-switch:tests/phase4_player_voluntary_switch_rom_test.lua|phase4-player-voluntary-switch:scripts/runtime_phase4_player_voluntary_switch_replay.sh|phase4-player-voluntary-switch:work/tasks/phase4-player-voluntary-switch.md|phase4-player-voluntary-switch:work/coordination/STATE.json|phase4-player-voluntary-switch:work/coordination/HANDOFF.md)
                ;;
              phase4-fixed-damage-effects:src/core/BattleEngine.lua|phase4-fixed-damage-effects:tests/battle_engine_test.lua|phase4-fixed-damage-effects:tests/phase4_fixed_damage_effect_rom_test.lua|phase4-fixed-damage-effects:scripts/runtime_phase4_fixed_damage_replay.sh|phase4-fixed-damage-effects:work/tasks/phase4-fixed-damage-effects.md|phase4-fixed-damage-effects:work/coordination/STATE.json|phase4-fixed-damage-effects:work/coordination/HANDOFF.md)
                ;;
              phase4-always-hit-effects:src/core/BattleEngine.lua|phase4-always-hit-effects:tests/battle_engine_test.lua|phase4-always-hit-effects:tests/phase4_always_hit_effect_rom_test.lua|phase4-always-hit-effects:scripts/runtime_phase4_always_hit_replay.sh|phase4-always-hit-effects:work/tasks/phase4-always-hit-effects.md|phase4-always-hit-effects:work/coordination/STATE.json|phase4-always-hit-effects:work/coordination/HANDOFF.md)
                ;;
              phase4-high-critical-effects:src/core/BattleEngine.lua|phase4-high-critical-effects:tests/battle_engine_test.lua|phase4-high-critical-effects:tests/phase4_high_critical_effect_rom_test.lua|phase4-high-critical-effects:scripts/runtime_phase4_high_critical_replay.sh|phase4-high-critical-effects:work/tasks/phase4-high-critical-effects.md|phase4-high-critical-effects:work/coordination/STATE.json|phase4-high-critical-effects:work/coordination/HANDOFF.md)
                ;;
              phase4-false-swipe-effects:src/core/BattleEngine.lua|phase4-false-swipe-effects:tests/battle_engine_test.lua|phase4-false-swipe-effects:tests/phase4_false_swipe_effect_rom_test.lua|phase4-false-swipe-effects:scripts/runtime_phase4_false_swipe_replay.sh|phase4-false-swipe-effects:work/tasks/phase4-false-swipe-effects.md|phase4-false-swipe-effects:work/coordination/STATE.json|phase4-false-swipe-effects:work/coordination/HANDOFF.md)
                ;;
              phase4-vital-throw-effects:src/core/BattleEngine.lua|phase4-vital-throw-effects:tests/battle_engine_test.lua|phase4-vital-throw-effects:tests/phase4_vital_throw_effect_rom_test.lua|phase4-vital-throw-effects:scripts/runtime_phase4_vital_throw_replay.sh|phase4-vital-throw-effects:work/tasks/phase4-vital-throw-effects.md|phase4-vital-throw-effects:work/coordination/STATE.json|phase4-vital-throw-effects:work/coordination/HANDOFF.md)
                ;;
              phase4-two-sided-replacement-state-api:src/core/BattleEngine.lua|phase4-two-sided-replacement-state-api:src/core/BattleSceneController.lua|phase4-two-sided-replacement-state-api:src/core/TrainerBattleOrchestrator.lua|phase4-two-sided-replacement-state-api:main.lua|phase4-two-sided-replacement-state-api:tests/battle_engine_test.lua|phase4-two-sided-replacement-state-api:tests/battle_scene_controller_test.lua|phase4-two-sided-replacement-state-api:tests/phase4_two_sided_replacement_state_test.lua|phase4-two-sided-replacement-state-api:tests/phase4_two_sided_replacement_state_rom_test.lua|phase4-two-sided-replacement-state-api:scripts/runtime_phase4_two_sided_replacement_replay.sh|phase4-two-sided-replacement-state-api:work/tasks/phase4-two-sided-replacement-state-api-design.md|phase4-two-sided-replacement-state-api:work/coordination/STATE.json|phase4-two-sided-replacement-state-api:work/coordination/HANDOFF.md)
                ;;
              phase4-explosion-effects:src/core/BattleEngine.lua|phase4-explosion-effects:tests/battle_engine_test.lua|phase4-explosion-effects:tests/phase4_explosion_effect_rom_test.lua|phase4-explosion-effects:scripts/runtime_phase4_explosion_replay.sh|phase4-explosion-effects:work/tasks/phase4-explosion-effects.md|phase4-explosion-effects:work/coordination/STATE.json|phase4-explosion-effects:work/coordination/HANDOFF.md)
                ;;
              phase4-super-fang-effects:src/core/BattleEngine.lua|phase4-super-fang-effects:tests/battle_engine_test.lua|phase4-super-fang-effects:tests/phase4_super_fang_effect_rom_test.lua|phase4-super-fang-effects:scripts/runtime_phase4_super_fang_replay.sh|phase4-super-fang-effects:work/tasks/phase4-super-fang-effects.md|phase4-super-fang-effects:work/coordination/STATE.json|phase4-super-fang-effects:work/coordination/HANDOFF.md)
                ;;
              phase4-flail-effects:src/core/BattleEngine.lua|phase4-flail-effects:tests/battle_engine_test.lua|phase4-flail-effects:tests/phase4_flail_effect_rom_test.lua|phase4-flail-effects:scripts/runtime_phase4_flail_replay.sh|phase4-flail-effects:work/tasks/phase4-flail-effects.md|phase4-flail-effects:work/coordination/STATE.json|phase4-flail-effects:work/coordination/HANDOFF.md)
                ;;
              phase4-eruption-effects:src/core/BattleEngine.lua|phase4-eruption-effects:tests/battle_engine_test.lua|phase4-eruption-effects:tests/phase4_eruption_effect_rom_test.lua|phase4-eruption-effects:scripts/runtime_phase4_eruption_replay.sh|phase4-eruption-effects:work/tasks/phase4-eruption-effects.md|phase4-eruption-effects:work/coordination/STATE.json|phase4-eruption-effects:work/coordination/HANDOFF.md)
                ;;
              phase4-psywave-effects:src/core/BattleEngine.lua|phase4-psywave-effects:tests/battle_engine_test.lua|phase4-psywave-effects:tests/phase4_psywave_effect_rom_test.lua|phase4-psywave-effects:scripts/runtime_phase4_psywave_replay.sh|phase4-psywave-effects:work/tasks/phase4-psywave-effects.md|phase4-psywave-effects:work/coordination/STATE.json|phase4-psywave-effects:work/coordination/HANDOFF.md)
                ;;
              phase4-ohko-effects:src/core/BattleEngine.lua|phase4-ohko-effects:tests/battle_engine_test.lua|phase4-ohko-effects:tests/phase4_ohko_effect_rom_test.lua|phase4-ohko-effects:scripts/runtime_phase4_ohko_replay.sh|phase4-ohko-effects:work/tasks/phase4-ohko-effects.md|phase4-ohko-effects:work/coordination/STATE.json|phase4-ohko-effects:work/coordination/HANDOFF.md)
                ;;
              phase4-endeavor-effects:src/core/BattleEngine.lua|phase4-endeavor-effects:tests/battle_engine_test.lua|phase4-endeavor-effects:tests/phase4_endeavor_effect_rom_test.lua|phase4-endeavor-effects:scripts/runtime_phase4_endeavor_replay.sh|phase4-endeavor-effects:src/core/BattleSceneController.lua|phase4-endeavor-effects:tests/battle_scene_controller_test.lua|phase4-endeavor-effects:work/tasks/phase4-endeavor-effects.md|phase4-endeavor-effects:work/coordination/STATE.json|phase4-endeavor-effects:work/coordination/HANDOFF.md)
                ;;
              *)
                echo "Patch target is not authorized for explicit route '$ROUTE': $target" >&2
                exit 1
                ;;
            esac
          done <<< "$targets"
          git apply --check "$PATCH_FILE"

      - name: Apply bounded patch
        if: steps.request.outputs.mode == 'patch'
        shell: bash
        env:
          PATCH_FILE: ${{ steps.request.outputs.file }}
        run: |
          set -euo pipefail
          git apply "$PATCH_FILE"
          git diff --check

      - name: Run task-focused test
        if: steps.request.outputs.mode == 'patch'
        shell: bash
        env:
          ROUTE: ${{ steps.route.outputs.route }}
        run: |
          set -euo pipefail
          if command -v lua5.1 >/dev/null; then LUA=lua5.1; else LUA=lua; fi
          case "$ROUTE" in
            oak-parcel-dex-presentation-north)
              "$LUA" tests/oak_parcel_dex_presentation_test.lua
              ;;
            phase3-title-oak-entry-proof)
              "$LUA" tests/phase3_title_oak_entry_test.lua
              ;;
            phase3-complete-runtime-exit-replay)
              "$LUA" tests/phase3_complete_runtime_exit_replay_test.lua
              ;;
            phase2-gba-camera-viewport-proof)
              "$LUA" tests/camera_viewport_test.lua
              "$LUA" tests/phase2_camera_viewport_integration_test.lua
              ;;
            phase2-oak-reference-evidence-harness)
              "$LUA" tests/phase2_oak_reference_evidence_test.lua
              ;;
            phase4-trainer-party-no-item-layouts)
              "$LUA" tests/trainer_pokemon_factory_test.lua
              "$LUA" tests/phase4_trainer_party_rom_test.lua
              ;;
            phase4-foe-only-multimon-trainer-orchestration)
              "$LUA" tests/phase4_foe_only_multimon_controller_test.lua
              "$LUA" tests/phase4_foe_only_multimon_rom_test.lua
              ;;
            phase4-player-forced-replacement-ui)
              "$LUA" tests/phase4_player_forced_replacement_controller_test.lua
              "$LUA" tests/phase4_player_forced_replacement_rom_test.lua
              ;;
            phase4-player-voluntary-switch)
              "$LUA" tests/phase4_player_voluntary_switch_controller_test.lua
              "$LUA" tests/phase4_player_voluntary_switch_rom_test.lua
              ;;
            phase4-fixed-damage-effects)
              "$LUA" tests/battle_engine_test.lua
              "$LUA" tests/phase4_fixed_damage_effect_rom_test.lua
              ;;
            phase4-always-hit-effects)
              "$LUA" tests/battle_engine_test.lua
              "$LUA" tests/phase4_always_hit_effect_rom_test.lua
              ;;
            phase4-high-critical-effects)
              "$LUA" tests/battle_engine_test.lua
              "$LUA" tests/phase4_high_critical_effect_rom_test.lua
              ;;
            phase4-false-swipe-effects)
              "$LUA" tests/battle_engine_test.lua
              "$LUA" tests/phase4_false_swipe_effect_rom_test.lua
              ;;
            phase4-vital-throw-effects)
              "$LUA" tests/battle_engine_test.lua
              "$LUA" tests/phase4_vital_throw_effect_rom_test.lua
              ;;
            phase4-two-sided-replacement-state-api)
              "$LUA" tests/battle_engine_test.lua
              "$LUA" tests/battle_scene_controller_test.lua
              "$LUA" tests/phase4_two_sided_replacement_state_test.lua
              "$LUA" tests/phase4_two_sided_replacement_state_rom_test.lua
              ;;
            phase4-explosion-effects)
              "$LUA" tests/battle_engine_test.lua
              "$LUA" tests/phase4_explosion_effect_rom_test.lua
              ;;
            phase4-super-fang-effects)
              "$LUA" tests/battle_engine_test.lua
              "$LUA" tests/phase4_super_fang_effect_rom_test.lua
              ;;
            phase4-flail-effects)
              "$LUA" tests/battle_engine_test.lua
              "$LUA" tests/phase4_flail_effect_rom_test.lua
              ;;
            phase4-eruption-effects)
              "$LUA" tests/battle_engine_test.lua
              "$LUA" tests/phase4_eruption_effect_rom_test.lua
              ;;
            phase4-psywave-effects)
              "$LUA" tests/battle_engine_test.lua
              "$LUA" tests/phase4_psywave_effect_rom_test.lua
              ;;
            phase4-ohko-effects)
              "$LUA" tests/battle_engine_test.lua
              "$LUA" tests/phase4_ohko_effect_rom_test.lua
              ;;
            phase4-endeavor-effects)
              "$LUA" tests/battle_engine_test.lua
              "$LUA" tests/battle_scene_controller_test.lua
              "$LUA" tests/phase4_endeavor_effect_rom_test.lua
              ;;
            *)
              echo "Patch execution has no focused-test route for '$ROUTE'." >&2
              exit 1
              ;;
          esac

      - name: Run no-ROM suite
        if: steps.request.outputs.mode == 'patch'
        shell: bash
        run: |
          set -euo pipefail
          env -u POKEPORT_ROM bash scripts/test_all.sh

      - name: Run verified-ROM suite
